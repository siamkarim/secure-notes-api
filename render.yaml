# Render Blueprint: in Render choose New > Blueprint and pick this repository.
services:
  - type: web
    name: secure-notes-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "3"
      # Random secrets generated by Render, never stored in the repository.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Asked for when the Blueprint is created.
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
